[project]
name = "vibefinance-backend"
version = "0.1.0"
description = "FastAPI backend for VibeFinance"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "fastembed>=0.7,<1.0",
    "langgraph>=1.0,<2.0",
    "langchain-anthropic>=1.0,<2.0",
    "langchain-experimental>=0.3,<1.0",
    "langchain-openai>=1.0,<2.0",
    "pgvector>=0.3,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pypdf>=6.0,<7.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
